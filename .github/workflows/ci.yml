name: build-and-test

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        working-directory: build
        run: ctest -C Release --output-on-failure

      - name: Package idoc_cli for download
        shell: bash
        run: |
          mkdir -p dist
          BIN=$(find build -type f \( -iname "idoc_cli" -o -iname "idoc_cli.exe" \) | head -n 1)
          if [ -z "$BIN" ]; then
            echo "idoc_cli binary not found under build/" >&2
            exit 1
          fi
          echo "Packaging: $BIN"
          cp "$BIN" dist/

      - name: Upload idoc_cli artifact
        uses: actions/upload-artifact@v4
        with:
          name: idoc_cli-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
